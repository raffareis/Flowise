name: Flowise candidate and explicit promotion

# Consolidating main must never rebuild/restart production.
on:
    workflow_dispatch:
        inputs:
            operation:
                description: 'candidate publishes an image only; plan is read-only'
                type: choice
                options: [plan, candidate, promote, rollback]
                default: plan
                required: true
            version:
                description: 'Existing EB application version with an immutable image digest'
                type: string
            digest:
                description: 'Reviewed target sha256 digest'
                type: string
            expected_current:
                description: 'Expected current production VersionLabel'
                type: string
            current_digest:
                description: 'Reviewed current digest for rollback'
                type: string
            bundle_sha256:
                description: 'Reviewed target bundle SHA256'
                type: string
            current_bundle_sha256:
                description: 'Reviewed current bundle SHA256'
                type: string
            canary:
                description: 'Distinct Green canary environment already running the target version'
                type: string

permissions:
    contents: read
    actions: read

concurrency:
    group: flowise-release
    cancel-in-progress: false

env:
    AWS_REGION: us-east-1

jobs:
    candidate:
        if: github.ref == 'refs/heads/main' && inputs.operation == 'candidate'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Require successful CI for this source commit
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  for workflow in main.yml test_docker_build.yml; do
                    result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&status=completed" --jq '.workflow_runs | sort_by(.id) | last | .conclusion')
                    test "$result" = success
                  done
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1
                  allowed-account-ids: '387653681120'
            - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
            - name: Publish unique candidate tag; never latest
              id: image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: 387653681120.dkr.ecr.us-east-1.amazonaws.com/flowise:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  labels: org.opencontainers.image.revision=${{ github.sha }}
            - name: Record candidate identity
              env:
                  DIGEST: ${{ steps.image.outputs.digest }}
              run: |
                  printf 'Source: `%s`\nImage: `387653681120.dkr.ecr.us-east-1.amazonaws.com/flowise@%s`\nNo production deployment was performed.\n' "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

    release:
        if: github.ref == 'refs/heads/main' && inputs.operation != 'candidate'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: flowise-production
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1
                  allowed-account-ids: '387653681120'
            - name: Inspect or explicitly promote the reviewed version
              env:
                  OPERATION: ${{ inputs.operation }}
                  VERSION: ${{ inputs.version }}
                  DIGEST: ${{ inputs.digest }}
                  EXPECTED_CURRENT: ${{ inputs.expected_current }}
                  CURRENT_DIGEST: ${{ inputs.current_digest }}
                  CANARY: ${{ inputs.canary }}
                  BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
                  CURRENT_BUNDLE_SHA256: ${{ inputs.current_bundle_sha256 }}
              run: |
                  set -euo pipefail
                  args=(--version "$VERSION" --digest "$DIGEST" --expected-current "$EXPECTED_CURRENT" --current-digest "$CURRENT_DIGEST" --bundle-sha256 "$BUNDLE_SHA256" --current-bundle-sha256 "$CURRENT_BUNDLE_SHA256")
                  if [[ "$OPERATION" == rollback ]]; then args+=(--operation rollback); else args+=(--canary "$CANARY"); fi
                  if [[ "$OPERATION" != plan ]]; then args+=(--live --evidence release-evidence.json); fi
                  python3 scripts/xmacna/release.py "${args[@]}"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always() && inputs.operation != 'plan'
              with:
                  name: flowise-release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: release-evidence.json
                  if-no-files-found: error
                  retention-days: 90
